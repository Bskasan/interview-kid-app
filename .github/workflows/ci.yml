name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Generates the gitignored typed-routes declarations tsc needs.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build (expo export)
        run: npm run build

      # Post-merge proof that main always builds: keep the bundle around.
      - name: Upload export artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: expo-export
          path: .expo-export
          retention-days: 14
