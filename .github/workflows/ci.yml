name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # 1. Bumped to v5 to resolve the Node 20/24 deprecation warning
      - uses: actions/checkout@v5

      # 2. Bumped to v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Generates the gitignored typed-routes declarations tsc needs.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build (expo export)
        run: npm run build

      # Post-merge proof that main always builds: keep the bundle around.
      - name: Upload export artifact
        if: github.event_name == 'push'
        # 3. Bumped to v5
        uses: actions/upload-artifact@v5
        with:
          name: expo-export
          # 4. Updated to 'dist' (the modern Expo default export directory)
          path: dist
          retention-days: 14
